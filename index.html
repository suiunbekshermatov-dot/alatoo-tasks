<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ala-Too IT & Business College — Task Tracker</title>
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --alatoo-blue: #0c2340;
      --alatoo-blue-light: #1e3a8a;
      --alatoo-red: #c8102e;
      --alatoo-red-soft: #fee2e2;
      --bg-main: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success-bg: #ecfdf5;
      --success-text: #065f46;
      --success-btn: #10b981;
      --warning-bg: #fffbeb;
      --warning-text: #92400e;
      --warning-btn: #f59e0b;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
      --shadow-card: 0 4px 6px -1px rgba(12, 35, 64, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg-main); color: var(--text-main); padding: 12px; -webkit-font-smoothing: antialiased; }
    .container { max-width: 600px; margin: 0 auto; }

    .brand-header {
      background: linear-gradient(135deg, var(--alatoo-blue) 0%, #162e52 100%);
      border-radius: 18px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      color: #ffffff;
      box-shadow: var(--shadow-card);
      margin-bottom: 14px;
    }
    .brand-logo-wrap {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #ffffff;
      padding: 2px;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .brand-logo-svg { width: 100%; height: 100%; border-radius: 50%; }
    .brand-info { flex: 1; }
    .brand-title { font-size: 15px; font-weight: 700; line-height: 1.2; }
    .brand-sub { font-size: 11px; opacity: 0.85; margin-top: 2px; text-transform: uppercase; letter-spacing: 0.5px; color: #cbd5e1; }
    .btn-edupage {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(4px);
      color: #ffffff;
      text-decoration: none;
      font-size: 11px;
      font-weight: 600;
      padding: 7px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      white-space: nowrap;
    }

    .status-badge-cloud {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      background: #e0f2fe;
      color: #0369a1;
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: 600;
      margin-bottom: 10px;
    }
    .status-dot { width: 7px; height: 7px; background: #0284c7; border-radius: 50%; }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 15px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 12px;
    }
    .card label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 6px; }

    select, input, textarea {
      width: 100%;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 14px;
      color: var(--text-main);
      margin-bottom: 10px;
      outline: none;
    }

    .filter-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 10px; }
    .filter-btn {
      background: #f1f5f9;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }
    .filter-btn.active { background: var(--alatoo-blue); color: #ffffff; border-color: var(--alatoo-blue); }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }
    .btn-main { background: var(--alatoo-blue); color: #ffffff; }
    .btn-done { background: var(--success-btn); color: #ffffff; flex: 1; }
    .btn-delay { background: var(--warning-btn); color: #ffffff; flex: 1; }
    .btn-small { padding: 6px 10px; font-size: 12px; border-radius: 8px; width: auto; }

    .staff-tag-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .staff-tag {
      background: #f1f5f9;
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 14px;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .staff-tag span { cursor: pointer; color: var(--alatoo-red); font-weight: bold; }

    .task-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 10px;
    }
    .task-card.is-overdue { border-left: 4px solid var(--alatoo-red); }
    .task-top { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
    .task-title-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 4px; }
    .task-title { font-size: 15px; font-weight: 700; color: var(--text-main); }
    .task-desc { font-size: 13px; color: #475569; line-height: 1.4; margin-bottom: 10px; }

    .badge { padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; white-space: nowrap; }
    .badge-pending { background: #f1f5f9; color: #475569; }
    .badge-done { background: var(--success-bg); color: var(--success-text); }
    .badge-delayed { background: var(--warning-bg); color: var(--warning-text); }
    .badge-overdue { background: var(--alatoo-red-soft); color: var(--alatoo-red); }

    .history-card {
      background: #fffdf5;
      border-left: 3px solid var(--warning-btn);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 12px;
      color: #92400e;
      margin-bottom: 10px;
    }

    .btn-actions { display: flex; gap: 8px; }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(12, 35, 64, 0.45);
      backdrop-filter: blur(3px);
      align-items: flex-end;
      justify-content: center;
      z-index: 100;
    }
    .modal.active { display: flex; }
    .sheet {
      background: #ffffff;
      width: 100%;
      max-width: 600px;
      border-radius: 20px 20px 0 0;
      padding: 20px;
      box-shadow: 0 -4px 16px rgba(0,0,0,0.1);
      animation: slideIn 0.22s ease-out;
    }
    @keyframes slideIn { from { transform: translateY(100%); } to { transform: translateY(0); } }
  </style>
</head>
<body>

<div class="container">

  <!-- Фирменная шапка с вектором логотипа Ala-Too -->
  <div class="brand-header">
    <div class="brand-logo-wrap">
      <svg class="brand-logo-svg" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="48" fill="#0c2340" stroke="#ffffff" stroke-width="2"/>
        <circle cx="50" cy="50" r="36" fill="#c8102e"/>
        <circle cx="42" cy="30" r="4" fill="#ffffff"/>
        <polygon points="26,50 44,35 62,50" fill="#ffffff"/>
        <polygon points="46,50 64,32 82,50" fill="#ffffff"/>
        <path d="M 22 62 Q 50 56 78 62" stroke="#ffffff" stroke-width="2.5" fill="none"/>
        <path d="M 28 72 Q 50 60 72 72" stroke="#ffffff" stroke-width="2.5" fill="none"/>
        <path d="M 36 82 Q 50 64 64 82" stroke="#ffffff" stroke-width="2.5" fill="none"/>
      </svg>
    </div>
    <div class="brand-info">
      <div class="brand-title">Ala-Too College</div>
      <div class="brand-sub">IT & Business College</div>
    </div>
    <a href="https://aiuspo.edupage.org/timetable/" target="_blank" class="btn-edupage">📅 EduPage</a>
  </div>

  <div style="display:flex; justify-content:space-between; align-items:center;">
    <div class="status-badge-cloud"><span class="status-dot"></span> Облако: Онлайн</div>
  </div>

  <div class="card">
    <label>АКТИВНЫЙ ПРОФИЛЬ:</label>
    <select id="userSelector" onchange="handleRoleChange()"></select>
  </div>

  <div class="card" id="staffManagementBlock" style="display:none;">
    <label>СОСТАВ КОЛЛЕДЖА (ОТДЕЛЕНИЯ / ПРЕПОДАВАТЕЛИ):</label>
    <div style="display: flex; gap: 8px;">
      <input type="text" id="newStaffName" placeholder="ФИО преподавателя или отдел..." style="margin-bottom: 0;" />
      <button type="button" class="btn-main btn-small" onclick="addNewStaff()">Добавить</button>
    </div>
    <div class="staff-tag-list" id="staffTagList"></div>
  </div>

  <div class="card" id="directorBlock" style="display:none;">
    <h2 style="font-size:15px; font-weight:700; color:var(--alatoo-blue); margin-bottom:10px;">➕ Новое поручение директора</h2>
    <form id="taskCreateForm" onsubmit="createTask(event)">
      <input type="text" id="tTitle" placeholder="Тема поручения..." required />
      <label>ОТВЕТСТВЕННЫЙ:</label>
      <select id="tAssignee" required></select>
      <label>СРОК СДАЧИ (ДЕДЛАЙН):</label>
      <input type="date" id="tDeadline" required />
      <textarea id="tDesc" rows="2" placeholder="Детали, указания и требования к результату..."></textarea>
      <button type="submit" class="btn-main">Назначить поручение</button>
    </form>
  </div>

  <div class="filter-tabs">
    <button class="filter-btn active" onclick="setFilter('all', this)">Все (<span id="cntAll">0</span>)</button>
    <button class="filter-btn" onclick="setFilter('pending', this)">В работе (<span id="cntPending">0</span>)</button>
    <button class="filter-btn" onclick="setFilter('overdue', this)" style="color:var(--alatoo-red);">Просрочено (<span id="cntOverdue">0</span>)</button>
    <button class="filter-btn" onclick="setFilter('done', this)">Выполнено (<span id="cntDone">0</span>)</button>
    <button class="filter-btn" onclick="setFilter('logs', this)" style="background:#fff7ed; color:#c2410c;">📜 Журнал логов (<span id="cntLogs">0</span>)</button>
  </div>

  <div id="tasksList"></div>

</div>

<!-- Шторка фиксации причины -->
<div class="modal" id="delaySheet">
  <div class="sheet">
    <h3 style="font-size: 16px; font-weight: 700; color:var(--alatoo-blue); margin-bottom: 10px;">⚠️ Фиксация причины переноса</h3>
    <form id="delayForm" onsubmit="saveDelay(event)">
      <input type="hidden" id="delayId" />
      <label>Новый дедлайн:</label>
      <input type="date" id="newDateVal" required />
      <label>Причина невыполнения в срок (обязательно):</label>
      <textarea id="reasonVal" rows="3" placeholder="Укажите объективную причину задержки..." required></textarea>
      <div style="display: flex; gap: 8px;">
        <button type="button" onclick="closeDelaySheet()" style="background: #e2e8f0; color: #475569;">Отмена</button>
        <button type="submit" class="btn-delay">Зафиксировать</button>
      </div>
    </form>
  </div>
</div>

<script>
  // Инициализация Firebase с вашими ключами
  const firebaseConfig = {
    apiKey: "AIzaSyAowQPFwo5ywZ1Sg-Y4WgtqlzVvE9Eyh0M",
    authDomain: "alatoo-college-tasks.firebaseapp.com",
    projectId: "alatoo-college-tasks",
    storageBucket: "alatoo-college-tasks.firebasestorage.app",
    messagingSenderId: "313809401509",
    appId: "1:313809401509:web:2b93e856c87dd064c67f4c"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const DIRECTOR_PIN = "1234";
  let currentFilter = 'all';
  let staffList = [];
  let tasks = [];

  const defaultStaff = [
    "Зав. IT-отделением",
    "Учебно-методический отдел",
    "Преподаватель: Султанов А.",
    "Преподаватель: Исмаилова М.",
    "Кураторская служба"
  ];

  // Синхронизация состава преподавателей в реальном времени
  db.collection("settings").doc("staff").onSnapshot(doc => {
    if (doc.exists && doc.data().list) {
      staffList = doc.data().list;
    } else {
      staffList = defaultStaff;
      db.collection("settings").doc("staff").set({ list: defaultStaff });
    }
    updateStaffDropdowns();
    renderApp();
  });

  // Синхронизация задач в реальном времени
  db.collection("tasks").onSnapshot(snapshot => {
    tasks = [];
    snapshot.forEach(doc => {
      tasks.push({ id: doc.id, ...doc.data() });
    });
    // Сортировка по времени создания
    tasks.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    renderApp();
  });

  function handleRoleChange() {
    const user = document.getElementById("userSelector").value;
    if (user === "Директор") {
      const pin = prompt("Введите PIN-код директора:");
      if (pin !== DIRECTOR_PIN) {
        alert("Неверный PIN-код!");
        document.getElementById("userSelector").value = staffList[0] || "";
        renderApp();
        return;
      }
    }
    renderApp();
  }

  function updateStaffDropdowns() {
    const userSelector = document.getElementById("userSelector");
    const taskAssignee = document.getElementById("tAssignee");
    const current = userSelector.value || "Директор";

    userSelector.innerHTML = `<option value="Директор">🎓 Директор колледжа</option>`;
    staffList.forEach(name => {
      userSelector.innerHTML += `<option value="${name}">👤 ${name}</option>`;
    });
    userSelector.value = current;

    taskAssignee.innerHTML = "";
    staffList.forEach(name => {
      taskAssignee.innerHTML += `<option value="${name}">${name}</option>`;
    });

    document.getElementById("staffTagList").innerHTML = staffList.map((name, idx) => `
      <div class="staff-tag">${name} <span onclick="removeStaff(${idx})">×</span></div>
    `).join("");
  }

  function addNewStaff() {
    const input = document.getElementById("newStaffName");
    const name = input.value.trim();
    if (name && !staffList.includes(name)) {
      staffList.push(name);
      db.collection("settings").doc("staff").set({ list: staffList });
      input.value = "";
    }
  }

  function removeStaff(idx) {
    if (confirm(`Удалить "${staffList[idx]}"?`)) {
      staffList.splice(idx, 1);
      db.collection("settings").doc("staff").set({ list: staffList });
    }
  }

  function setFilter(filter, btn) {
    currentFilter = filter;
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    renderApp();
  }

  function isOverdue(deadlineStr, status) {
    if (status === "done") return false;
    const today = new Date().toISOString().split("T")[0];
    return deadlineStr < today;
  }

  function renderApp() {
    const user = document.getElementById("userSelector").value;
    const isDirector = (user === "Директор");

    document.getElementById("directorBlock").style.display = isDirector ? "block" : "none";
    document.getElementById("staffManagementBlock").style.display = isDirector ? "block" : "none";

    const baseList = isDirector ? tasks : tasks.filter(t => t.assignee === user);

    let totalLogsCount = 0;
    baseList.forEach(t => { if (t.history) totalLogsCount += t.history.length; });

    document.getElementById("cntAll").textContent = baseList.length;
    document.getElementById("cntPending").textContent = baseList.filter(t => t.status !== "done").length;
    document.getElementById("cntOverdue").textContent = baseList.filter(t => isOverdue(t.deadline, t.status)).length;
    document.getElementById("cntDone").textContent = baseList.filter(t => t.status === "done").length;
    document.getElementById("cntLogs").textContent = totalLogsCount;

    const container = document.getElementById("tasksList");
    container.innerHTML = "";

    if (currentFilter === 'logs') {
      let logsHtml = "";
      baseList.forEach(t => {
        if (t.history && t.history.length > 0) {
          t.history.forEach(h => {
            logsHtml += `
              <div class="task-card" style="border-left: 4px solid var(--warning-btn);">
                <div class="task-top">
                  <span>👤 <b>${t.assignee}</b></span>
                  <span>📅 Зафиксировано: <b>${h.date}</b></span>
                </div>
                <div class="task-title" style="margin-bottom:6px;">${t.title}</div>
                <div class="history-card">
                  <b>Срок перенесен:</b> с ${h.oldDate} ➔ на <b>${h.newDate}</b><br>
                  <b>Причина:</b> <i>${h.reason}</i>
                </div>
              </div>
            `;
          });
        }
      });

      if (!logsHtml) {
        container.innerHTML = `<div style="background:#fff; border:1px solid var(--border); border-radius:14px; padding:24px; text-align:center; color:var(--text-muted); font-size:13px;">Журнал переносов пуст</div>`;
      } else {
        container.innerHTML = logsHtml;
      }
      return;
    }

    let displayTasks = baseList;
    if (currentFilter === 'pending') displayTasks = baseList.filter(t => t.status !== 'done');
    if (currentFilter === 'overdue') displayTasks = baseList.filter(t => isOverdue(t.deadline, t.status));
    if (currentFilter === 'done') displayTasks = baseList.filter(t => t.status === 'done');

    if (displayTasks.length === 0) {
      container.innerHTML = `<div style="background:#fff; border:1px solid var(--border); border-radius:14px; padding:24px; text-align:center; color:var(--text-muted); font-size:13px;">Нет поручений в этой категории</div>`;
      return;
    }

    displayTasks.forEach(t => {
      const overdue = isOverdue(t.deadline, t.status);
      let badge = `<span class="badge badge-pending">В процессе</span>`;
      if (t.status === "done") badge = `<span class="badge badge-done">✓ Выполнено</span>`;
      else if (overdue) badge = `<span class="badge badge-overdue">🚨 Просрочено</span>`;
      else if (t.status === "delayed") badge = `<span class="badge badge-delayed">Перенесено</span>`;

      let historyLog = "";
      if (t.history && t.history.length > 0) {
        historyLog = t.history.map(h => `
          <div class="history-card">
            <b>📜 Лог переноса (на ${h.newDate}):</b><br>
            <i>Причина: ${h.reason}</i>
          </div>
        `).join("");
      }

      let actionButtons = "";
      if (t.status !== "done") {
        actionButtons = `
          <div class="btn-actions">
            <button class="btn-done" onclick="finishTask('${t.id}')">Выполнил</button>
            <button class="btn-delay" onclick="openDelaySheet('${t.id}')">Не выполнил</button>
          </div>
        `;
      }

      const card = document.createElement("div");
      card.className = `task-card ${overdue ? 'is-overdue' : ''}`;
      card.innerHTML = `
        <div class="task-top">
          <span>👤 <b>${t.assignee}</b></span>
          <span>📅 Дедлайн: <b>${t.deadline}</b></span>
        </div>
        <div class="task-title-row">
          <div class="task-title">${t.title}</div>
          <div>${badge}</div>
        </div>
        <div class="task-desc">${t.desc || "Без описания"}</div>
        ${historyLog}
        ${actionButtons}
      `;
      container.appendChild(card);
    });
  }

  function createTask(e) {
    e.preventDefault();
    const newTask = {
      title: document.getElementById("tTitle").value,
      assignee: document.getElementById("tAssignee").value,
      deadline: document.getElementById("tDeadline").value,
      desc: document.getElementById("tDesc").value,
      status: "pending",
      history: [],
      createdAt: Date.now()
    };
    db.collection("tasks").add(newTask);
    document.getElementById("taskCreateForm").reset();
  }

  function finishTask(id) {
    db.collection("tasks").doc(id).update({ status: "done" });
  }

  function openDelaySheet(id) {
    document.getElementById("delayId").value = id;
    document.getElementById("delaySheet").classList.add("active");
  }

  function closeDelaySheet() {
    document.getElementById("delaySheet").classList.remove("active");
    document.getElementById("delayForm").reset();
  }

  function saveDelay(e) {
    e.preventDefault();
    const id = document.getElementById("delayId").value;
    const newDate = document.getElementById("newDateVal").value;
    const reason = document.getElementById("reasonVal").value;

    const t = tasks.find(x => x.id === id);
    if (t) {
      const history = t.history || [];
      history.push({
        oldDate: t.deadline,
        newDate: newDate,
        reason: reason,
        date: new Date().toLocaleDateString()
      });

      db.collection("tasks").doc(id).update({
        deadline: newDate,
        status: "delayed",
        history: history
      });
      closeDelaySheet();
    }
  }
</script>

</body>
</html>
